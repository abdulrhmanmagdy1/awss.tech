<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Aws Apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#8bd0ff"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c045"/>
      <stop offset="1" stop-color="#ffd56a"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="240" cy="160" r="190" fill="url(#g)" opacity="0.22" filter="url(#blur)"/>
  <circle cx="980" cy="520" r="260" fill="url(#a)" opacity="0.18" filter="url(#blur)"/>
  <path d="M0,420 C220,360 380,520 600,460 C820,400 960,300 1200,360 L1200,630 L0,630 Z" fill="#0b1020" opacity="0.55"/>

  <g transform="translate(90,120)">
    <rect x="0" y="0" width="150" height="150" rx="36" fill="url(#g)" opacity="0.16"/>
    <rect x="18" y="18" width="114" height="114" rx="28" fill="none" stroke="url(#g)" stroke-width="6" opacity="0.7"/>
    <text x="75" y="98" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="900" fill="#eaf2ff" letter-spacing="2">
      AWS
    </text>
  </g>

  <g font-family="Cairo, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="1130" y="210" text-anchor="end" font-size="56" font-weight="900" fill="#eaf2ff">
      Aws Apps
    </text>
    <text x="1130" y="275" text-anchor="end" font-size="32" font-weight="700" fill="#8bd0ff">
